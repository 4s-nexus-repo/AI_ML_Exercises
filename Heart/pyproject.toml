[project]
name = "heart-disease-prediction"
version = "0.1.0"
description = "Heart disease prediction with 5 scaling techniques"
authors = [
    {name = "Rohith Bellapu"}
]
license = "Rohith Bellapu"
requires-python = ">=3.11,<3.14.1 || >3.14.1,<3.15"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tune (>=0.1.6,<0.2.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "shap (>=0.51.0,<0.52.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "torchvision (>=0.26.0,<0.27.0)",
    "tensorflow (>=2.21.0,<3.0.0)",
    "tensorflow-metal (>=1.2.0,<2.0.0)",
    "keras (>=3.14.0,<4.0.0)",
    "fastapi (>=0.136.1,<0.137.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
train   = "heart_disease.train:main"
predict = "heart_disease.predict:main"
eda     = "heart_disease.eda:main"
tune    = "heart_disease.tune:main"
shap    = "heart_disease.shap_explain:main"
sanity  = "heart_disease.sanity_check:main"
nn      = "heart_disease.neural_network:main"