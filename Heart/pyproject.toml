[project]
name = "heart-disease-prediction"
version = "0.1.0"
description = "Heart disease prediction with 5 scaling techniques"
authors = [
    {name = "Rohith Bellapu"}
]
license = "Rohith Bellapu"
requires-python = "^3.11"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tune (>=0.1.6,<0.2.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "shap (>=0.51.0,<0.52.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
train   = "heart_disease.train:main"
predict = "heart_disease.predict:main"
eda     = "heart_disease.eda:main"
tune    = "tune:main"
shap    = "shap_explain:main"